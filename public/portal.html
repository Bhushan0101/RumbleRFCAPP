<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#161616" />
    <meta
      name="description"
      content="Your RFC fighter profile, category rankings and next fight."
    />
    <title>Member portal | RFC</title>
    <link rel="stylesheet" href="portal.css" />
  </head>
  <body class="portal">
    <div class="topbar">
      <div class="container">
        <span>RUMBLE FIGHTING CHAMPIONSHIP</span
        ><a href="index.html">Back to RFC website ↗</a>
      </div>
    </div>
    <header class="portal-header">
      <div class="container nav-shell">
        <a href="#rankings" class="wordmark" aria-label="RFC member portal"
          >RFC<span>.</span><small>MEMBER PORTAL</small></a
        >
        <nav id="portal-navigation" aria-label="Member portal"></nav>
        <div class="account-controls" id="account-controls"></div>
      </div>
    </header>
    <main class="container portal-shell" id="main-content">
      <div class="demo-banner" id="demo-banner" hidden>
        <span class="demo-dot"></span>Stakeholder preview<span
          class="demo-divider"
          >/</span
        >Sample data. Changes may reset after a redeploy.
      </div>
      <div id="notice" role="status" aria-live="polite"></div>
      <div id="portal-app">
        <div class="loading-state">
          <span class="loading-dot"></span>Getting your corner ready…
        </div>
      </div>
    </main>
    <footer class="portal-footer">
      <div class="container">
        <a href="index.html" class="wordmark">RFC<span>.</span></a
        ><span>BUILT FOR THE NEXT CHAPTER.</span>
        <p>Development preview · Sample athletes and events.</p>
      </div>
    </footer>
    <script type="module" src="portal.js"></script>
  </body>
</html>
