<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>W.U.C.O Admin · Local content management</title>
<link rel="stylesheet" href="style.css">
<style>
.admin-wrap{max-width:1100px;margin:0 auto;padding:30px 5%}
.admin-banner{background:#5a1d1d;color:#fff;padding:12px 18px;font-size:12px;letter-spacing:1px;text-align:center}
.admin-top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:24px 0}
.admin-top h1{font-size:40px}
.admin-rail{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.admin-rail button{padding:10px 16px;border:1px solid var(--line);background:#fff;text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:1px}
.admin-rail button.active{background:var(--green);color:#fff;border-color:var(--green)}
.admin-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:30px}
.admin-table th,.admin-table td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.admin-table th{background:#eaece4;text-transform:uppercase;font-size:10px;letter-spacing:1px}
.admin-form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;background:#fff;border:1px solid var(--line);padding:22px;margin-bottom:30px}
.admin-form label{display:flex;flex-direction:column;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);gap:6px}
.admin-form .full{grid-column:1/-1}
.admin-form textarea{min-height:80px;padding:12px;border:1px solid var(--line);font:inherit}
.admin-actions{display:flex;gap:10px;align-items:center}
.btn{background:var(--green);color:#fff;padding:12px 20px;text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:1px;border:1px solid var(--green)}
.btn.ghost{background:#fff;color:var(--green)}
.btn.danger{background:#fff;color:#a12b2b;border-color:#a12b2b;padding:6px 10px}
.admin-msg{font-size:12px;padding:10px 0;min-height:20px}
.admin-msg.err{color:#a12b2b}.admin-msg.ok{color:var(--green)}
.upload-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.upload-row input[type=file]{font-size:11px;padding:4px;border:0}
.upload-row small{font-size:10px;color:var(--muted)}
.login-box{max-width:360px;margin:60px auto;background:#fff;border:1px solid var(--line);padding:30px}
.login-box input{width:100%;margin:12px 0}
</style>
</head>
<body>
<div class="admin-banner" id="admin-banner">LOCAL ADMIN — sample content concept. Do not expose this server publicly.</div>
<div class="admin-wrap" id="admin"></div>
<script src="admin.js"></script>
</body>
</html>
