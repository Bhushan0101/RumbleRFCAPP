<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a2f23">
<title>Digital Fighter Passport | W.U.C.O</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:#0a1510;min-height:100vh;display:grid;place-items:center;padding:28px;font-family:Barlow,Arial,sans-serif}
.passport-shell{width:min(960px,100%);display:flex;flex-direction:column;gap:18px}
.passport-top{display:flex;justify-content:space-between;align-items:center;color:#d4af37;font-family:'Barlow Condensed',Impact,sans-serif;letter-spacing:2px;font-size:11px}
.passport-top a{color:#d4af37;border-bottom:1px solid #d4af37;padding-bottom:3px}
.passport{position:relative;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#0a2f23 0%,#0b3d2e 55%,#07251b 100%);color:#fff;padding:40px;box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 0 0 2px rgba(212,175,55,.45)}
.passport::before{content:"";position:absolute;inset:12px;border:2px solid rgba(212,175,55,.35);border-radius:10px;pointer-events:none}
.passport-head{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:28px;position:relative;z-index:1}
.passport-head .mark-row{display:flex;align-items:center;gap:18px}
.passport-head .mark-row img{width:60px;height:60px;object-fit:contain}
.passport-head .wordmark{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:900;font-size:52px;letter-spacing:2px}
.passport-head .wordmark .tm{font-size:14px;vertical-align:super;color:#d4af37;margin-left:4px}
.passport-head .tagline{font-family:'Barlow Condensed',Impact,sans-serif;font-size:10px;letter-spacing:4px;color:#fff}
.passport-head .tagline em{font-style:normal;color:#d4af37}
.passport-title{text-align:center;font-family:'Barlow Condensed',Impact,sans-serif;font-weight:900;font-size:40px;letter-spacing:2px;margin:0 auto 28px;position:relative;z-index:1}
.passport-title em{font-style:normal;color:#d4af37}
.passport-body{display:grid;grid-template-columns:230px 1fr 220px;gap:28px;align-items:start;position:relative;z-index:1}
.passport-portrait{width:230px;height:260px;object-fit:cover;border:2px solid #d4af37;border-radius:4px;background:#07251b}
.passport-portrait.placeholder{display:grid;place-items:center;color:#8aa39a;font-family:'Barlow Condensed';font-weight:900;font-size:80px;letter-spacing:-2px}
.passport-rows{display:flex;flex-direction:column;gap:14px}
.passport-row{display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:center;border-bottom:1px solid rgba(212,175,55,.2);padding-bottom:10px}
.passport-row:last-child{border-bottom:0}
.passport-row .label{color:#d4af37;font-family:'Barlow Condensed',Impact,sans-serif;font-size:13px;letter-spacing:2px}
.passport-row .value{font-family:'Barlow Condensed',Impact,sans-serif;font-size:22px;font-weight:700}
.passport-row .value.status-active{color:#38d996}
.passport-row .value.status-suspended{color:#ff9a3c}
.passport-side{display:flex;flex-direction:column;gap:14px;align-items:center}
.passport-flag{width:90px;height:60px;border-radius:4px;display:grid;grid-template-columns:1fr 1fr 1fr;overflow:hidden;border:1px solid rgba(212,175,55,.5)}
.passport-flag span:nth-child(1){background:#169b62}
.passport-flag span:nth-child(2){background:#fff}
.passport-flag span:nth-child(3){background:#ff883e}
.fighter-no-chip{text-align:center;padding:10px 14px;border:2px solid #d4af37;border-radius:6px;background:rgba(0,0,0,.25);width:100%}
.fighter-no-chip small{display:block;font-family:'Barlow Condensed',Impact,sans-serif;color:#d4af37;font-size:11px;letter-spacing:2px}
.fighter-no-chip b{display:block;font-family:'Barlow Condensed',Impact,sans-serif;font-size:22px;letter-spacing:1px;margin-top:3px}
.qr-box{background:#fff;border:3px solid #d4af37;border-radius:6px;padding:8px;width:168px;height:168px;display:grid;place-items:center}
#qr-canvas{width:150px;height:150px;image-rendering:pixelated}
.qr-caption{text-align:center;font-family:'Barlow Condensed',Impact,sans-serif;font-size:10px;letter-spacing:1.5px;color:#d4af37;max-width:180px}
.passport-footer{display:flex;justify-content:space-around;flex-wrap:wrap;gap:14px;margin-top:30px;padding-top:22px;border-top:1px solid rgba(212,175,55,.3);position:relative;z-index:1;font-family:'Barlow Condensed';font-size:11px;letter-spacing:1.5px;color:#cfe3d8;text-align:center}
.passport-footer div strong{color:#fff;display:block;font-size:12px;letter-spacing:1.5px;margin-top:2px}
.passport-strip{text-align:center;background:#07251b;padding:11px;margin-top:14px;color:#d4af37;font-family:'Barlow Condensed',Impact,sans-serif;letter-spacing:3px;font-size:11px;border-radius:0 0 10px 10px;position:relative;z-index:1;margin:14px -40px -40px}
.passport-error{color:#fff;text-align:center;padding:48px 20px;font-family:'Barlow Condensed',Impact,sans-serif}
.passport-error h2{font-size:34px;letter-spacing:2px}
.passport-error p{color:#9fb4aa;font-size:14px}
@media(max-width:860px){.passport-body{grid-template-columns:1fr}.passport-portrait{width:100%;height:280px}.passport-side{flex-direction:row;flex-wrap:wrap;justify-content:center}.passport-title{font-size:28px}}
@media print{body{background:#fff}.passport-top{display:none}}
</style>
</head>

  function QRBitBuffer(){this.buffer=[];this.length=0;}
  QRBitBuffer.prototype={get:function(index){var bufIndex=Math.floor(index/8);return((this.buffer[bufIndex]>>>(7-index%8))&1)==1;},put:function(num,length){for(var i=0;i<length;i++)this.putBit(((num>>>(length-i-1))&1)==1);},getLengthInBits:function(){return this.length;},putBit:function(bit){var bufIndex=Math.floor(this.length/8);if(this.buffer.length<=bufIndex)this.buffer.push(0);if(bit)this.buffer[bufIndex]|=(0x80>>>(this.length%8));this.length++;}};
  window.renderQR=function(text,canvas,size){size=size||150;var typeNumber=1;for(;typeNumber<=10;typeNumber++){try{var qr=new QRCodeModel(typeNumber,QRErrorCorrectLevel.L);qr.addData(text);qr.make();break;}catch(e){}}var modules=qr.getModuleCount();canvas.width=modules;canvas.height=modules;canvas.style.width=size+'px';canvas.style.height=size+'px';var ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,modules,modules);ctx.fillStyle='#0b3d2e';for(var r=0;r<modules;r++)for(var c=0;c<modules;c++)if(qr.isDark(r,c))ctx.fillRect(c,r,1,1);};
})();

const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params = new URLSearchParams(location.search);
const fighterNo = (params.get('no') || '').trim().toUpperCase();
const root = document.querySelector('#passport');

function errorCard(msg) {
  return `<div class="passport-error"><h2>Passport unavailable</h2><p>${esc(msg)}</p><p><a href="index.html" style="color:#d4af37">Return to W.U.C.O</a></p></div>`;
}

async function render() {
  if (!fighterNo) { root.innerHTML = errorCard('Add a fighter number to the URL, for example: passport.html?no=IRL-000247'); return; }
  if (!/^[A-Z]{3}-[0-9]{3,8}$/.test(fighterNo)) { root.innerHTML = errorCard('That fighter number is not valid.'); return; }
  let data;
  try {
    const res = await fetch('/api/passport/' + encodeURIComponent(fighterNo));
    if (res.status === 404) { root.innerHTML = errorCard('No active fighter is linked to ' + fighterNo + '.'); return; }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (err) {
    root.innerHTML = errorCard('Could not reach the records service. Try again shortly.');
    return;
  }
  document.title = `${data.name} · ${data.fighter_no} | W.U.C.O Passport`;
  const portrait = data.portrait_url
    ? `<img class="passport-portrait" src="${esc(data.portrait_url)}" alt="Portrait of ${esc(data.name)}">`
    : `<div class="passport-portrait placeholder">${esc((data.name || 'F')[0])}</div>`;
  const statusClass = data.status === 'Active' ? 'status-active' : 'status-suspended';
  root.innerHTML = `
    <header class="passport-head">
      <div class="mark-row">
        <img src="assets/logos/wuco-mark.png" alt="">
        <span class="wordmark">WUCO<span class="tm">TM</span></span>
        <img src="assets/logos/wuco-mark.png" alt="">
      </div>
      <div class="tagline">WORLD UNITED COMBAT ORGANISATION · <em>IRELAND</em></div>
    </header>
    <h1 class="passport-title">DIGITAL FIGHTER <em>PASSPORT</em></h1>
    <div class="passport-body">
      ${portrait}
      <div class="passport-rows">
        <div class="passport-row"><span class="label">▣ NAME</span><span class="value">${esc(data.name)}</span></div>
        <div class="passport-row"><span class="label">⌂ CLUB</span><span class="value">${esc(data.club)}</span></div>
        <div class="passport-row"><span class="label">⚖ DIVISION</span><span class="value">${esc(data.division)}</span></div>
        <div class="passport-row"><span class="label">⚡ DISCIPLINE</span><span class="value">${esc(data.martial_art || '—')}</span></div>
        <div class="passport-row"><span class="label">⌯ CLASS</span><span class="value">${esc(data.class_code || '—')}</span></div>
        <div class="passport-row"><span class="label">▦ RECORD</span><span class="value">${esc(data.record)}</span></div>
        <div class="passport-row"><span class="label">◉ STATUS</span><span class="value ${statusClass}">${esc(data.status)}</span></div>
        <div class="passport-row"><span class="label">◇ NATIONALITY</span><span class="value">${esc(data.nationality)}</span></div>
      </div>
      <div class="passport-side">
        <div class="passport-flag" aria-label="Flag of Ireland"><span></span><span></span><span></span></div>
        <div class="fighter-no-chip">
          <small>WUCO FIGHTER NO</small>
          <b>${esc(data.fighter_no)}</b>
        </div>
        <div class="qr-box"><canvas id="qr-canvas"></canvas></div>
        <div class="qr-caption">SCAN TO VERIFY FIGHTER<br>RECORD AND RANKINGS</div>
      </div>
    </div>
    <footer class="passport-footer">
      <div>▢<strong>VERIFIED FIGHTER</strong></div>
      <div>▬▬<strong>RANKINGS INTEGRATED</strong></div>
      <div>⬢<strong>GLOBAL ATHLETE DATABASE</strong></div>
      <div>⌾<strong>FUTURE READY COMBAT SPORTS</strong></div>
    </footer>
    <div class="passport-strip">OFFICIAL W.U.C.O IRELAND SPORTING CREDENTIAL</div>
  `;
  const canvas = document.querySelector('#qr-canvas');
  if (canvas && window.renderQR) {
    window.renderQR(location.origin + location.pathname + '?no=' + encodeURIComponent(data.fighter_no), canvas, 150);
  }
}
render();
</script>
</body>
</html>
