# Stakeholder TEST DEMO. Public dummy credentials; never use this mode for real member data.
# Free-tier storage is ephemeral: edits and registrations reset after restart/redeploy.
services:
  - type: web
    name: WUCO-Portal
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn main:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: WUCO_DEMO_MODE
        value: "1"
      - key: RFC_DB_PATH
        value: /tmp/rfc-demo.sqlite3
      - key: WUCO_PAYMENT_MODE
        value: demo
